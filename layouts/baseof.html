<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ hugo.Data.profile.name }}{{ end }}</title>
  <meta name="description" content="{{ .Description | default .Summary | default site.Params.description | plainify }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="icon" href="{{ "icons/favicon.svg" | relURL }}" type="image/svg+xml">
  {{ $css := resources.Get "css/styles.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
  <meta name="theme-color" content="#f7f8fa">
  <meta property="og:title" content="{{ .Title | default site.Title }}">
  <meta property="og:description" content="{{ .Description | default site.Params.description }}">
  <meta property="og:type" content="{{ if eq .Section "blog" }}article{{ else }}website{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ "images/social-card.png" | absURL }}">
  {{ with .OutputFormats.Get "RSS" }}<link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="{{ .RelPermalink }}">{{ end }}
  {{ if or .Draft (gt .PublishDate now) }}<meta name="robots" content="noindex,nofollow">{{ end }}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {{ partial "header.html" . }}
  <main id="main" tabindex="-1">{{ block "main" . }}{{ end }}</main>
  {{ partial "footer.html" . }}
</body>
</html>
