{{ define "main" }}
<div class="wrap page-shell">
<header class="page-header"><p class="eyebrow">Research, scouting &amp; reporting</p><h1>{{ .Title }}</h1><p class="page-intro">{{ .Description }}</p></header>
{{ with .Content }}<div class="section-intro prose">{{ . }}</div>{{ end }}
<div class="project-grid">{{ range .RegularPages.ByWeight }}{{ partial "project-card.html" . }}{{ end }}</div>
<div class="section-footer"><p>More from the work behind the reports.</p><a class="text-link" href="{{ "blog/" | relURL }}">Visit the Analytics Journal <span aria-hidden="true">↗</span></a></div>
</div>
{{ end }}
