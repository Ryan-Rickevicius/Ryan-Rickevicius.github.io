<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" role="img" aria-labelledby="title desc">
<title id="title">Pitch location and the space between pitches</title><desc id="desc">An explanatory schematic of two pitch paths arriving at different locations in the strike zone. This is a conceptual diagram, not measured pitch data.</desc>
