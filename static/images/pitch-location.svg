<path d="M346 371H414V392L380 412L346 392Z" fill="none" stroke="#61798d" stroke-width="1.3"/>
<text x="618" y="443" text-anchor="end" fill="#61798d" font-family="Arial,sans-serif" font-size="11">SCHEMATIC</text>
