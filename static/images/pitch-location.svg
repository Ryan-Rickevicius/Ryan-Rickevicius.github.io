<circle cx="345" cy="222" r="9" fill="#0d6b63" stroke="#e8f2f3" stroke-width="4"/>
<circle cx="423" cy="288" r="9" fill="#416778" stroke="#e8f2f3" stroke-width="4"/>
<path d="M357 212L439 280M355 207L349 216M444 277L437 285" stroke="#142235" stroke-width="1.2" fill="none"/>
