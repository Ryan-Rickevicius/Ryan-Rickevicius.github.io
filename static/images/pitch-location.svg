<g stroke="#d4e2e6" stroke-width="1"><path d="M70 100H620M70 180H620M70 260H620M70 340H620M150 70V405M250 70V405M350 70V405M450 70V405M550 70V405"/></g>
<g fill="#526779" font-family="Arial,sans-serif" font-size="12" letter-spacing="2"><text x="44" y="45">PITCH LOCATION</text><text x="44" y="442">A PITCH-TO-PITCH VIEW</text></g>
<g fill="none" stroke="#61798d"><path stroke-width="2" d="M300 123H458V339H300Z"/><path stroke-width="1" opacity=".4" d="M353 123V339M406 123V339M300 195H458M300 267H458"/></g>
<path d="M85 123C190 115 255 159 345 222" stroke="#0d6b63" stroke-width="3" fill="none"/>
