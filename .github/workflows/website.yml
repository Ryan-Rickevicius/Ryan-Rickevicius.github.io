name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
env:
  HUGO_VERSION: '0.169.0'
  TZ: America/New_York
  HUGO_ENVIRONMENT: production
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install Hugo
        run: |
          set -euo pipefail
          HUGO_ARCHIVE="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          HUGO_CHECKSUMS="hugo_${HUGO_VERSION}_checksums.txt"
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${HUGO_ARCHIVE}" -o "$RUNNER_TEMP/$HUGO_ARCHIVE"
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${HUGO_CHECKSUMS}" -o "$RUNNER_TEMP/$HUGO_CHECKSUMS"
          cd "$RUNNER_TEMP"
          sha256sum --check --ignore-missing "$HUGO_CHECKSUMS"
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf "$HUGO_ARCHIVE" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
      - name: Validate content
        run: python3 scripts/validate_content.py .
      - name: Build published website
        env:
          WEBSITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          hugo --gc --minify \
            --baseURL "${WEBSITE_BASE_URL%/}/" \
            --destination "$RUNNER_TEMP/published-site" \
            --buildDrafts=false --buildFuture=false --buildExpired=false
          test -s "$RUNNER_TEMP/published-site/index.html"
      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/published-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
