name: Preview drafts
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  HUGO_VERSION: '0.169.0'
  TZ: America/New_York
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Hugo
        run: |
          set -euo pipefail
          HUGO_ARCHIVE="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${HUGO_ARCHIVE}" -o "$RUNNER_TEMP/$HUGO_ARCHIVE"
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          cd "$RUNNER_TEMP"
          sha256sum --check --ignore-missing checksums.txt
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf "$HUGO_ARCHIVE" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
      - name: Validate content
        run: python3 scripts/validate_content.py .
      - name: Build draft preview
        env:
          HUGO_RELATIVEURLS: 'true'
        run: |
          hugo --buildDrafts --buildFuture --baseURL https://preview.invalid/ --destination "$RUNNER_TEMP/draft-preview"
          python3 scripts/prepare_preview.py "$RUNNER_TEMP/draft-preview"
      - name: Downloadable preview
        uses: actions/upload-artifact@v6
        with:
          name: draft-website-preview
          path: ${{ runner.temp }}/draft-preview
          retention-days: 7
